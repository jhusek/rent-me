name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Wails app
        run: wails build -platform windows/amd64 -clean

      - name: Get version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RentMe ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: build/bin/RentMe.exe
          body: |
            ## RentMe — Rental Property Manager

            ### 📥 Installation
            1. Download `RentMe.exe` below
            2. Double-click to run — no installation needed
            3. Your data is stored in `%AppData%\RentMe\rentme.db` — it survives updates and reinstalls

            ### ✨ Features
            - Dashboard with income/expense charts
            - Tenant management & lease tracking
            - Rent payment logging
            - Expense tracking (IRS Schedule E aligned)
            - Maintenance request workflow
            - Document storage
            - Reminders & alerts
            - Tax reports & CSV export
